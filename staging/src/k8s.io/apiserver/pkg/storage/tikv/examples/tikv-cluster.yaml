# tikv-cluster.yaml
#
# A minimal, self-contained TiKV deployment that is API-compatible with the
# kube-apiserver TiKV storage backend at
#   k8s.io/apiserver/pkg/storage/tikv
#
# The bundle ships:
#   * 3 Placement Driver (PD) nodes  -- metadata, TSO, region scheduler
#   * 3 TiKV nodes                   -- the actual KV data plane
#   * One client-facing PD Service   -- target for --etcd-servers
#
# After `kubectl apply -f tikv-cluster.yaml`, point a kube-apiserver at the
# cluster:
#
#   kube-apiserver \
#       --storage-backend=tikv \
#       --etcd-servers=http://pd.tikv-system.svc:2379 \
#       ...other flags...
#
# For TLS, mount a CA+cert+key trusted by PD/TiKV and pass:
#       --etcd-cafile=/etc/ssl/tikv/ca.crt
#       --etcd-certfile=/etc/ssl/tikv/client.crt
#       --etcd-keyfile=/etc/ssl/tikv/client.key
#
# The backend treats PD's TSO as the resourceVersion source, so all PD members
# must agree on time; do not run with --advertise-client-urls disabled and do
# not split the PD quorum across high-latency zones.
#
# Image versions track the tikv/client-go v2.0.7 release line.  Upgrading to a
# newer TiKV/PD release requires bumping the client too.
#
# Resource requests are sized for a *development* footprint.  For production
# follow the official sizing guide: https://docs.pingcap.com/tidb/stable/hardware-and-software-requirements

---
apiVersion: v1
kind: Namespace
metadata:
  name: tikv-system
  labels:
    app.kubernetes.io/part-of: kube-apiserver-tikv-backend

---
# ---- PD (Placement Driver) -------------------------------------------------
# PD owns TSO allocation, region metadata, and GC service-safepoint
# registration.  The kube-apiserver compactor talks to PD via
# pd.Client.UpdateServiceGCSafePoint to pin a watch-replay window.

apiVersion: v1
kind: Service
metadata:
  name: pd-peer
  namespace: tikv-system
  labels:
    app.kubernetes.io/name: pd
spec:
  clusterIP: None              # headless: stable per-pod DNS names
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
  selector:
    app.kubernetes.io/name: pd

---
apiVersion: v1
kind: Service
metadata:
  name: pd
  namespace: tikv-system
  labels:
    app.kubernetes.io/name: pd
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 2379
      targetPort: 2379
  selector:
    app.kubernetes.io/name: pd

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pd
  namespace: tikv-system
  labels:
    app.kubernetes.io/name: pd
spec:
  serviceName: pd-peer
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: pd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pd
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pd
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pd
          image: pingcap/pd:v6.5.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          command:
            - /pd-server
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/pd
            - --client-urls=http://0.0.0.0:2379
            - --peer-urls=http://0.0.0.0:2380
            - --advertise-client-urls=http://$(POD_NAME).pd-peer.$(POD_NAMESPACE).svc:2379
            - --advertise-peer-urls=http://$(POD_NAME).pd-peer.$(POD_NAMESPACE).svc:2380
            - --initial-cluster=pd-0=http://pd-0.pd-peer.$(POD_NAMESPACE).svc:2380,pd-1=http://pd-1.pd-peer.$(POD_NAMESPACE).svc:2380,pd-2=http://pd-2.pd-peer.$(POD_NAMESPACE).svc:2380
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /pd/api/v1/members
              port: client
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /pd/api/v1/health
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/pd
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

---
# ---- TiKV ------------------------------------------------------------------
# TiKV is the row store.  It registers with PD at startup; the kube-apiserver
# never connects to TiKV directly -- it only knows the PD endpoints and lets
# the tikv/client-go library route requests to regions.

apiVersion: v1
kind: Service
metadata:
  name: tikv-peer
  namespace: tikv-system
  labels:
    app.kubernetes.io/name: tikv
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tikv
      port: 20160
      targetPort: 20160
    - name: status
      port: 20180
      targetPort: 20180
  selector:
    app.kubernetes.io/name: tikv

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tikv
  namespace: tikv-system
  labels:
    app.kubernetes.io/name: tikv
spec:
  serviceName: tikv-peer
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: tikv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tikv
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tikv
                topologyKey: kubernetes.io/hostname
      # TiKV needs PD to be reachable; an init-container blocks Pod start
      # until at least one PD endpoint answers.
      initContainers:
        - name: wait-for-pd
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z pd.tikv-system.svc 2379; do
                echo "waiting for PD..."
                sleep 2
              done
      containers:
        - name: tikv
          image: pingcap/tikv:v6.5.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 20160
              name: tikv
            - containerPort: 20180
              name: status
          command:
            - /tikv-server
            - --addr=0.0.0.0:20160
            - --advertise-addr=$(POD_NAME).tikv-peer.$(POD_NAMESPACE).svc:20160
            - --status-addr=0.0.0.0:20180
            - --advertise-status-addr=$(POD_NAME).tikv-peer.$(POD_NAMESPACE).svc:20180
            - --pd=pd.$(POD_NAMESPACE).svc:2379
            - --data-dir=/var/lib/tikv
            - --config=/etc/tikv/tikv.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            tcpSocket:
              port: tikv
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: tikv
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/tikv
            - name: config
              mountPath: /etc/tikv
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tikv-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
# tikv.toml: minimal TiKV config tuned for the kube-apiserver workload.
# * raftstore.sync-log = true            -> never lose committed writes
# * gc.ratio-threshold + safepoint TTL   -> long enough for compactor pings
# * server.grpc-concurrency               -> matches typical apiserver fan-out
# Adjust for production based on disk IOPS and concurrency.

apiVersion: v1
kind: ConfigMap
metadata:
  name: tikv-config
  namespace: tikv-system
data:
  tikv.toml: |
    log-level = "info"

    [server]
    grpc-concurrency = 4
    grpc-keepalive-time = "10s"
    grpc-keepalive-timeout = "3s"

    [raftstore]
    sync-log = true
    raft-base-tick-interval = "1s"
    raft-heartbeat-ticks = 2
    raft-election-timeout-ticks = 10

    [storage]
    scheduler-worker-pool-size = 4

    [gc]
    # ratio-threshold gates when GC reclaims an MVCC version chain.
    ratio-threshold = 1.1
    # batch-keys controls how many keys are GC'd per batch; lower = less spike.
    batch-keys = 512

    [readpool.unified]
    max-thread-count = 4

    [rocksdb]
    max-open-files = 4096
    [rocksdb.defaultcf]
    block-cache-size = "256MiB"
    [rocksdb.writecf]
    block-cache-size = "128MiB"
    [rocksdb.lockcf]
    block-cache-size = "32MiB"
